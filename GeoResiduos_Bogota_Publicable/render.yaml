# Publicar desde GitHub en Render -> New -> Blueprint.
# Base PostgreSQL gratis para demostración académica: caduca 30 días después de crearla.
# No guardar contraseñas en el repositorio.
databases:
  - name: georesiduos-db
    databaseName: georesiduos
    user: georesiduos
    plan: free
services:
  - type: web
    name: georesiduos-bogota
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 90 flask_backend:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: georesiduos-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: LOAD_DEMO
        value: 'true'
